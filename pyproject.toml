[project]
name = "allowance-clerk"
version = "0.1.0"
description = "UNBLOCK: an agent that finishes paywalled jobs under a deterministic allowance policy (Strands + Bedrock + x402)"
license = "Apache-2.0"
authors = [
    { name = "BUZZ AI CHILDREN", email = "yamadaike.coffee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "eth-account>=0.14.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "strands-agents[anthropic]>=1.53.0",
    "strands-agents-tools>=0.8.6",
    "uvicorn>=0.52.4",
    "x402[evm]>=2.20.0",
]

[project.scripts]
allowance-clerk = "allowance_clerk:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
